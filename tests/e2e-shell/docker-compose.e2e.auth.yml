# docker-compose.e2e.auth.yml — Override for E2E pass 2 (auth + PostgreSQL + S3 via versitygw)
#
# Usage: docker compose -f docker-compose.e2e.yml -f docker-compose.e2e.auth.yml up
#
# SECURITY: All credentials below are TEST-ONLY for ephemeral E2E containers.
# NEVER reuse these in production. Production deployments must use Docker secrets
# or a vault integration — see docs/deployment.md.
#
# Docker Compose environment merging is ADDITIVE: the override adds new env vars
# to the base file's environment block, it does not replace it. Base env vars
# (SGW_PROXY_AUTH_ENABLED, SGW_PROXY_TOKEN, etc.) are preserved.

services:
  postgres:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_DB: shieldoo_e2e
      POSTGRES_USER: shieldoo
      POSTGRES_PASSWORD: shieldoo_e2e_pass
    # No volume — always starts with an empty database. Migrations run at gateway startup.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shieldoo -d shieldoo_e2e"]
      interval: 2s
      timeout: 3s
      retries: 15
    networks:
      - internal-net
    restart: "no"

  s3:
    # versitygw serves a posix directory as S3; each top-level directory is a
    # bucket, so the entrypoint creates the bucket before the gateway starts.
    # Metadata goes to a sidecar dir because overlayfs may lack user xattrs.
    image: versity/versitygw:v1.11.0@sha256:8319a530d08d537426e2f855bae5280709795dc73a3f0c347973ef915d6343c5
    entrypoint:
      - /bin/sh
      - -c
      - mkdir -p /data/shieldoo-cache /meta && exec /usr/local/bin/versitygw --port :9000 --health /health posix --sidecar /meta /data
    environment:
      ROOT_ACCESS_KEY: e2eaccesskey
      ROOT_SECRET_KEY: e2esecretkey123
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/health"]
      interval: 2s
      timeout: 3s
      retries: 15
    networks:
      - internal-net
    restart: "no"

  shieldoo-gate:
    depends_on:
      scanner-bridge:
        condition: service_started
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
    environment:
      # Database → PostgreSQL
      # sslmode=disable is safe here (isolated Docker network);
      # production MUST use sslmode=require or sslmode=verify-full.
      SGW_DATABASE_BACKEND: "postgres"
      SGW_DATABASE_POSTGRES_DSN: "postgres://shieldoo:shieldoo_e2e_pass@postgres:5432/shieldoo_e2e?sslmode=disable&connect_timeout=5"
      # Cache → S3 (versitygw)
      # NOTE: The S3 backend will log a warning "non-HTTPS endpoint configured
      # (potential SSRF risk)" for http://s3:9000 — this is expected in E2E
      # and safe within the isolated Docker network.
      SGW_CACHE_BACKEND: "s3"
      SGW_CACHE_S3_BUCKET: "shieldoo-cache"
      SGW_CACHE_S3_ENDPOINT: "http://s3:9000"
      SGW_CACHE_S3_REGION: "us-east-1"
      SGW_CACHE_S3_FORCE_PATH_STYLE: "true"
      SGW_CACHE_S3_ACCESS_KEY_ENV: "S3_ACCESS_KEY"
      SGW_CACHE_S3_SECRET_KEY_ENV: "S3_SECRET_KEY"
      S3_ACCESS_KEY: "e2eaccesskey"
      S3_SECRET_KEY: "e2esecretkey123"

      # Policy mode → balanced for pass 2
      SGW_POLICY_MODE: "balanced"
      SGW_POLICY_AI_TRIAGE_ENABLED: "true"

  test-runner:
    environment:
      SGW_CACHE_BACKEND: "s3"
      SGW_DATABASE_BACKEND: "postgres"
      # Policy mode (test-runner needs to know current mode for adaptive assertions)
      SGW_POLICY_MODE: "balanced"
