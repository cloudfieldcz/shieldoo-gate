# Dependabot — automated dependency & digest bumps.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates
#
# Rationale: this is the auto-bump mechanism deferred in the
# 2026-06-18 security hardening plan (T2). It keeps the digest-pinned
# base images (ADR-014) and SHA-pinned GitHub Actions (ADR-015) from
# freezing on potentially-vulnerable layers.
version: 2

updates:
  # Go core proxy & API (go.mod at repo root).
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      gomod-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Admin UI (React/Vite).
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # TypeScript 7 (the native/Go compiler port) is unusable here until
      # typescript-eslint supports it: even its canary still declares
      # `peer typescript >=4.8.4 <6.1.0`, so `npm ci` fails ERESOLVE and the
      # type-aware lint rules have no supported parser. Dependabot reopened the
      # same unmergeable PR on every 7.x patch (#129).
      # REMOVE this entry once typescript-eslint's peer range admits 7.x.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Python scanner bridge (pinned requirements.txt compiled via uv).
  - package-ecosystem: "pip"
    directory: "/scanner-bridge"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"

  # Base image digests — production Dockerfile + e2e test runner.
  - package-ecosystem: "docker"
    directories:
      - "/docker"
      - "/tests/e2e-shell"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build(docker)"

  # Base image digest for the Python scanner bridge. Split out from the entry
  # above so the `python` hold below applies ONLY here — the other Dockerfiles
  # use node/golang/alpine/ubuntu bases and must keep receiving every bump.
  - package-ecosystem: "docker"
    directory: "/scanner-bridge"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build(docker)"
    ignore:
      # Python 3.14 is unusable here until guarddog relaxes its pygit2 bound:
      # every guarddog release through 3.2.0 (and `main`) constrains
      # `pygit2 >=1.11,<1.19`, and pygit2 ships cp314 wheels only from 1.19.0
      # on. Under 3.14 uv therefore falls back to the pygit2 sdist, which links
      # the builder's libgit2-dev; that .so is deliberately absent from the
      # runtime stage (ADR-010), so the image dies on its build-time import
      # check with `libgit2.so.1.9: cannot open shared object file`.
      # Dependabot reopened the same unmergeable PR on every 3.14.x release
      # (#184). Note the update-types: a docker tag bump 3.13.14 -> 3.14.7 is a
      # *minor* version change, not a major one, so semver-major alone would
      # not stop it; major is listed too because a hypothetical 4.x base hits
      # the identical missing-wheel blocker.
      # REMOVE this entry once a guarddog release allows `pygit2 >=1.19`.
      - dependency-name: "python"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  # GitHub Actions SHA pins (release.yml + future workflows).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build(ci)"
